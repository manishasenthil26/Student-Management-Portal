<main>
    <h2>Contact Information</h2>

    <p><strong>Institution:</strong> Student Management Portal</p>
    <p><strong>Email:</strong> student@example.com</p>
    <p><strong>Phone:</strong> +91 98765 43210</p>
    <p><strong>Address:</strong> Enter your college address here.</p>

    <h2>Send Us a Message</h2>

    <form action="#" method="get">

        <label for="visitor-name">Your Name:</label>
        <input type="text" id="visitor-name" name="name"
               placeholder="Enter your name" required>

        <label for="visitor-email">Your Email:</label>
        <input type="email" id="visitor-email" name="email"
               placeholder="Enter your email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message"
                  rows="5" placeholder="Enter your message"
                  required></textarea>

        <button type="submit">Send Message</button>

    </form>
</main>
